<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPM Cyber-Neon Gallery v5.8</title>
  <style>
    :root {
      --bg-main: #050508;
      --card-bg: rgba(15, 17, 26, 0.90);
      --card-inner: #121522;
      --border-color: #1f2438;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --neon-purple: #b000ff;
      --text-muted: #828a9e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: #ffffff;
      padding: 20px;
      min-height: 100vh;
      padding-bottom: 100px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 25%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 25%);
      background-attachment: fixed;
    }

    .container { max-width: 1350px; margin: 0 auto; }

    /* --- CYBER HEADER --- */
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; padding: 20px 30px; background: var(--card-bg);
      border: 1px solid var(--border-color); border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.08);
      backdrop-filter: blur(12px); flex-wrap: wrap; gap: 15px;
    }

    .logo-area h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .logo-area p { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 1px; margin-top: 4px; }

    /* --- DASHBOARD STATS --- */
    .stats-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px; margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 15px; border-radius: 12px; text-align: center;
      position: relative; overflow: hidden;
    }

    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), transparent);
    }

    .stat-val { font-size: 1.6rem; font-weight: 900; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

    /* --- FILTERS --- */
    .filter-box {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 20px; margin-bottom: 30px;
      display: flex; flex-direction: column; gap: 15px;
    }

    .filter-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; }

    @media (max-width: 900px) { .filter-grid { grid-template-columns: 1fr; } }

    .input-cyber {
      width: 100%; padding: 12px 16px; background: var(--card-inner);
      border: 1px solid var(--border-color); border-radius: 8px; color: #fff;
      outline: none; transition: 0.3s;
    }

    .input-cyber:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .pills-group { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }

    .pill-cyber {
      background: var(--card-inner); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 8px 18px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.3s;
    }

    .pill-cyber.active, .pill-cyber:hover {
      background: var(--neon-cyan); color: #000;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.6); border-color: var(--neon-cyan);
    }

    /* --- GALLERY GRID & NEON CARDS --- */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 25px; }

    .neon-card {
      background: var(--card-bg); border-radius: 18px; overflow: hidden;
      border: 1px solid var(--border-color); position: relative; transition: all 0.4s ease;
      display: flex; flex-direction: column;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .neon-card:hover {
      transform: translateY(-8px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.3);
    }

    .card-img-wrap { position: relative; width: 100%; height: 220px; background: #000; overflow: hidden; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
    .neon-card:hover .card-img-wrap img { transform: scale(1.05); }

    .card-img-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 40%, rgba(15,17,26,0.95) 100%);
      pointer-events: none;
    }

    .badge-stack { position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
    .cyber-badge { font-size: 0.65rem; padding: 5px 10px; border-radius: 6px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
    .badge-deal { background: var(--neon-pink); color: #fff; box-shadow: 0 0 10px var(--neon-pink); }
    .badge-livery { background: var(--neon-purple); color: #fff; box-shadow: 0 0 10px var(--neon-purple); }
    .badge-w16 { background: var(--neon-yellow); color: #000; box-shadow: 0 0 10px var(--neon-yellow); }

    .card-top-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; z-index: 2; }
    .icon-btn {
      background: rgba(5, 5, 8, 0.85); border: 1px solid var(--border-color); color: #fff;
      width: 38px; height: 38px; border-radius: 10px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.3s;
      backdrop-filter: blur(4px);
    }

    .icon-btn.fav.active { color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 12px var(--neon-pink); }

    .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; z-index: 1; }
    .seller-info { font-size: 0.8rem; color: var(--neon-cyan); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px; }
    .car-title { font-size: 1.35rem; font-weight: 900; margin: 6px 0 12px 0; letter-spacing: 0.5px; color: #fff; }

    .specs-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      background: var(--card-inner); padding: 12px; border-radius: 10px;
      font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05);
    }

    .specs-row div b { color: #fff; }

    .price-row {
      margin-top: auto; display: flex; justify-content: space-between; align-items: center;
      padding-top: 15px; border-top: 1px solid var(--border-color); margin-bottom: 15px;
    }

    .cyber-price { font-size: 1.3rem; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 10px rgba(0, 255, 102, 0.4); }

    .btn-contact {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 12px; background: linear-gradient(45deg, #ff0050, #00f2fe);
      border: none; border-radius: 10px; color: #fff; font-weight: 800;
      text-decoration: none; font-size: 0.85rem; text-transform: uppercase;
      letter-spacing: 1px; transition: 0.3s ease; box-shadow: 0 0 15px rgba(255, 0, 80, 0.3);
    }

    .btn-contact:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 0, 80, 0.7);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-area">
        <h1>CPM CYBER GALLERY ⚡</h1>
        <p>Car Parking Multiplayer Premium Trade Hub</p>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-lbl">Yayındaki Araçlar</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statW16" style="color: var(--neon-yellow);">0</div>
        <div class="stat-lbl">W16 Canavarlar</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statDeals" style="color: var(--neon-pink);">0</div>
        <div class="stat-lbl">Hot Deals / Fırsatlar</div>
      </div>
    </div>

    <!-- Filter Box -->
    <div class="filter-box">
      <div class="filter-grid">
        <input type="text" id="searchInput" class="input-cyber" placeholder="Araç adı, satıcı adresi ara..." oninput="filterCars()">
        <select id="sortSelect" class="input-cyber" onchange="filterCars()">
          <option value="newest">⚡ En Yeni İlanlar</option>
          <option value="hp-desc">🚀 En Yüksek HP</option>
          <option value="km-asc">🛣️ En Düşük KM</option>
          <option value="price-asc">💰 Fiyat (Düşükten Yükseğe)</option>
        </select>
        <input type="number" id="minHpInput" class="input-cyber" placeholder="Min HP..." oninput="filterCars()">
      </div>

      <div class="pills-group">
        <button class="pill-cyber active" onclick="setCategory('all', this)">Tüm Garaj</button>
        <button class="pill-cyber" onclick="setCategory('deal', this)">🔥 Fırsat Araçlar</button>
        <button class="pill-cyber" onclick="setCategory('livery', this)">🎨 Çizimli / Livery</button>
        <button class="pill-cyber" onclick="setCategory('w16', this)">⚡ W16 Motor</button>
        <button class="pill-cyber" onclick="setCategory('favs', this)">♥ Favorilerim</button>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="carGallery"></div>
  </div>

  <script>
    // Gönderdiğin orijinal fotoğrafın doğrudan HTML koduna entegre edilmiş hali
    const rawCars = [
      {
        id: 1,
        title: "MERCEDES TIR",
        seller: "Lütfü Uyar",
        tiktok: "@lutfu",
        hp: 150,
        km: 200,
        price: "TEKLİF ALINIR",
        rawPrice: 0,
        image: "WhatsApp Image 2026-08-08 at 13.02.04_2.jpeg",
        hasW16: false,
        hasLivery: true, 
        isDeal: true,
        isCoin: false
      }
    ];

    let favorites = [];
    let currentCategory = 'all';

    function updateStats() {
      document.getElementById('statTotal').textContent = rawCars.length;
      document.getElementById('statW16').textContent = rawCars.filter(c => c.hasW16).length;
      document.getElementById('statDeals').textContent = rawCars.filter(c => c.isDeal).length;
    }

    function toggleFavorite(id, event) {
      event.stopPropagation();
      if(favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      renderGallery();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.pill-cyber').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      renderGallery();
    }

    function filterCars() {
      renderGallery();
    }

    function renderGallery() {
      const gallery = document.getElementById('carGallery');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;
      const minHp = parseInt(document.getElementById('minHpInput').value) || 0;

      let filtered = rawCars.filter(car => {
        const matchesSearch = car.title.toLowerCase().includes(search) || car.seller.toLowerCase().includes(search) || car.tiktok.toLowerCase().includes(search);
        const matchesHp = car.hp >= minHp;
        
        let matchesCategory = true;
        if(currentCategory === 'deal') matchesCategory = car.isDeal;
        if(currentCategory === 'livery') matchesCategory = car.hasLivery;
        if(currentCategory === 'w16') matchesCategory = car.hasW16;
        if(currentCategory === 'favs') matchesCategory = favorites.includes(car.id);

        return matchesSearch && matchesHp && matchesCategory;
      });

      if(sort === 'hp-desc') filtered.sort((a,b) => b.hp - a.hp);
      if(sort === 'km-asc') filtered.sort((a,b) => a.km - b.km);
      if(sort === 'price-asc') filtered.sort((a,b) => a.rawPrice - b.rawPrice);

      if(filtered.length === 0) {
        gallery.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--text-muted);">
            <h3 style="font-size: 1.5rem; margin-bottom: 10px;">🏎️ Henüz Vitrinde Araç Bulunmuyor</h3>
          </div>
        `;
        return;
      }

      gallery.innerHTML = filtered.map(car => {
        const isFav = favorites.includes(car.id);
        const tiktokLink = car.tiktok.startsWith('@') ? `https://www.tiktok.com/${car.tiktok}` : `https://www.tiktok.com/@${car.tiktok}`;

        return `
          <div class="neon-card">
            <div class="card-img-wrap">
              <img src="${car.image}" alt="${car.title}">
              <div class="card-img-overlay"></div>
              
              <div class="badge-stack">
                ${car.isDeal ? `<span class="cyber-badge badge-deal">🔥 HOT DEAL</span>` : ''}
                ${car.hasW16 ? `<span class="cyber-badge badge-w16">⚡ W16</span>` : ''}
                ${car.hasLivery ? `<span class="cyber-badge badge-livery">🎨 ÖZEL ÇİZİM</span>` : ''}
              </div>

              <div class="card-top-actions">
                <button class="icon-btn fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${car.id}, event)">
                  ${isFav ? '♥' : '♡'}
                </button>
              </div>
            </div>

            <div class="card-body">
              <div class="seller-info">👤 ${car.seller} <span style="color: var(--text-muted);">(${car.tiktok})</span></div>
              <div class="car-title">${car.title}</div>
              
              <div class="specs-row">
                <div>⚡ Güç: <b>${car.hp} HP</b></div>
                <div>🛣️ Mesafe: <b>${car.km} KM</b></div>
              </div>

              <div class="price-row">
                <span style="font-size:0.75rem; color: var(--text-muted); text-transform: uppercase;">Fiyat Durumu:</span>
                <div class="cyber-price">${car.price}</div>
              </div>

              <a href="${tiktokLink}" target="_blank" class="btn-contact">
                🎵 TikTok'tan Ulaş (${car.tiktok})
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    updateStats();
    renderGallery();
  </script>
</body>
</html>
