<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPM Cyber-Neon Gallery v5.2</title>
  <style>
    :root {
      --bg-main: #050508;
      --card-bg: rgba(15, 17, 26, 0.85);
      --card-inner: #121522;
      --border-color: #1f2438;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #ffe600;
      --neon-green: #00ff66;
      --neon-purple: #b000ff;
      --text-muted: #828a9e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }

    body {
      background-color: var(--bg-main);
      color: #ffffff;
      padding: 20px;
      min-height: 100vh;
      padding-bottom: 100px;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(0, 243, 255, 0.05) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 85, 0.05) 0%, transparent 20%);
      background-attachment: fixed;
    }

    .container { max-width: 1350px; margin: 0 auto; }

    /* --- CYBER HEADER --- */
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px; padding: 20px; background: var(--card-bg);
      border: 1px solid var(--border-color); border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.1);
      backdrop-filter: blur(10px); flex-wrap: wrap; gap: 15px;
    }

    .logo-area h1 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
    }

    .logo-area p { color: var(--text-muted); font-size: 0.85rem; letter-spacing: 1px; margin-top: 4px; }

    .btn-cyber {
      background: linear-gradient(45deg, var(--neon-pink), var(--neon-purple));
      color: #fff; border: none; padding: 12px 24px; border-radius: 8px;
      font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
      cursor: pointer; transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
    }

    .btn-cyber:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(255, 0, 85, 0.8);
    }

    /* --- DASHBOARD STATS --- */
    .stats-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px; margin-bottom: 25px;
    }

    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      padding: 15px; border-radius: 12px; text-align: center;
      position: relative; overflow: hidden;
    }

    .stat-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px;
      background: linear-gradient(90deg, var(--neon-cyan), transparent);
    }

    .stat-val { font-size: 1.6rem; font-weight: 900; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
    .stat-lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-top: 4px; }

    /* --- FILTERS --- */
    .filter-box {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 20px; margin-bottom: 30px;
      display: flex; flex-direction: column; gap: 15px;
    }

    .filter-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; }

    @media (max-width: 900px) { .filter-grid { grid-template-columns: 1fr; } }

    .input-cyber {
      width: 100%; padding: 12px 16px; background: var(--card-inner);
      border: 1px solid var(--border-color); border-radius: 8px; color: #fff;
      outline: none; transition: 0.3s;
    }

    .input-cyber:focus {
      border-color: var(--neon-cyan);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }

    .pills-group { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }

    .pill-cyber {
      background: var(--card-inner); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 8px 18px; border-radius: 20px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.3s;
    }

    .pill-cyber.active, .pill-cyber:hover {
      background: var(--neon-cyan); color: #000;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.6); border-color: var(--neon-cyan);
    }

    /* --- GALLERY GRID & NEON CARDS --- */
    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 25px; }

    .neon-card {
      background: var(--card-bg); border-radius: 16px; overflow: hidden;
      border: 1px solid var(--border-color); position: relative; transition: all 0.4s ease;
      cursor: pointer; display: flex; flex-direction: column;
    }

    .neon-card:hover {
      transform: translateY(-7px);
      border-color: var(--neon-cyan);
      box-shadow: 0 0 25px rgba(0, 243, 255, 0.25);
    }

    .card-img-wrap { position: relative; width: 100%; height: 200px; background: #000; }
    .card-img-wrap img { width: 100%; height: 100%; object-fit: cover; }

    .badge-stack { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
    .cyber-badge { font-size: 0.65rem; padding: 4px 10px; border-radius: 4px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
    .badge-deal { background: var(--neon-pink); color: #fff; box-shadow: 0 0 10px var(--neon-pink); }
    .badge-livery { background: var(--neon-purple); color: #fff; box-shadow: 0 0 10px var(--neon-purple); }
    .badge-w16 { background: var(--neon-yellow); color: #000; box-shadow: 0 0 10px var(--neon-yellow); }

    .card-top-actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 8px; z-index: 2; }
    .icon-btn {
      background: rgba(5, 5, 8, 0.8); border: 1px solid var(--border-color); color: #fff;
      width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.3s;
    }

    .icon-btn.fav.active { color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }

    .card-body { padding: 18px; flex-grow: 1; display: flex; flex-direction: column; }
    .seller-info { font-size: 0.75rem; color: var(--neon-cyan); font-weight: 700; text-transform: uppercase; }
    .car-title { font-size: 1.25rem; font-weight: 800; margin: 4px 0 10px 0; }

    .specs-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      background: var(--card-inner); padding: 10px; border-radius: 8px;
      font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.03);
    }

    .price-row {
      margin-top: auto; display: flex; justify-content: space-between; align-items: center;
      padding-top: 12px; border-top: 1px solid var(--border-color);
    }

    .cyber-price { font-size: 1.25rem; font-weight: 900; color: var(--neon-green); text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
    .cyber-price.coin { color: var(--neon-yellow); text-shadow: 0 0 8px rgba(255, 230, 0, 0.4); }

    /* --- MODALS & FORM ELEMENTS --- */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }

    .modal-content {
      background: var(--card-bg); border: 1px solid var(--neon-cyan);
      border-radius: 20px; width: 100%; max-width: 650px; max-height: 90vh;
      overflow-y: auto; position: relative; padding: 25px;
      box-shadow: 0 0 40px rgba(0, 243, 255, 0.2);
    }

    .close-btn {
      position: absolute; top: 15px; right: 15px; background: rgba(255, 255, 255, 0.1);
      border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%;
      cursor: pointer; font-size: 1.1rem;
    }

    .img-preview-box {
      width: 100%; height: 150px; border: 2px dashed var(--neon-cyan);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      margin-top: 8px; background: var(--card-inner); overflow: hidden; position: relative;
    }

    .img-preview-box img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .img-preview-placeholder { text-align: center; color: var(--text-muted); font-size: 0.85rem; }

    .checkbox-group {
      display: flex; gap: 15px; flex-wrap: wrap; margin-top: 5px;
    }

    .checkbox-label {
      display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-area">
        <h1>CPM CYBER GALLERY ⚡</h1>
        <p>Car Parking Multiplayer Premium Trade Hub</p>
      </div>

      <button class="btn-cyber" onclick="openAddModal()">➕ İlan Gönder</button>
    </header>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-lbl">Yayındaki Araçlar</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statW16" style="color: var(--neon-yellow);">0</div>
        <div class="stat-lbl">W16 Canavarlar</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statDeals" style="color: var(--neon-pink);">0</div>
        <div class="stat-lbl">Hot Deals / Fırsatlar</div>
      </div>
    </div>

    <!-- Filter Box -->
    <div class="filter-box">
      <div class="filter-grid">
        <input type="text" id="searchInput" class="input-cyber" placeholder="Araç adı, satıcı adresi ara..." oninput="filterCars()">
        <select id="sortSelect" class="input-cyber" onchange="filterCars()">
          <option value="newest">⚡ En Yeni İlanlar</option>
          <option value="hp-desc">🚀 En Yüksek HP</option>
          <option value="km-asc">🛣️ En Düşük KM</option>
          <option value="price-asc">💰 Fiyat (Düşükten Yükseğe)</option>
        </select>
        <input type="number" id="minHpInput" class="input-cyber" placeholder="Min HP..." oninput="filterCars()">
      </div>

      <div class="pills-group">
        <button class="pill-cyber active" onclick="setCategory('all', this)">Tüm Garaj</button>
        <button class="pill-cyber" onclick="setCategory('deal', this)">🔥 Fırsat Araçlar</button>
        <button class="pill-cyber" onclick="setCategory('livery', this)">🎨 Çizimli / Livery</button>
        <button class="pill-cyber" onclick="setCategory('w16', this)">⚡ W16 Motor</button>
        <button class="pill-cyber" onclick="setCategory('coin', this)">🪙 Coin İle Satılanlar</button>
        <button class="pill-cyber" onclick="setCategory('favs', this)">♥ Favorilerim</button>
      </div>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-grid" id="carGallery"></div>
  </div>

  <!-- ADD LISTING MODAL -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeAddModal()">✕</button>
      <h2 style="color: var(--neon-cyan); margin-bottom: 15px;">📢 İlan Gönder</h2>
      
      <!-- FORMSPREE ENTEGRELİ FORM -->
      <form action="https://formspree.io/f/myegkzoo" method="POST">
        
        <div class="form-group">
          <label for="userEmail">E-posta Adresiniz:</label>
          <input type="email" name="Gönderen Email" id="userEmail" class="input-cyber" placeholder="ornek@gmail.com" required>
        </div>

        <div class="form-group">
          <label>Araç Görseli Seçin:</label>
          <input type="file" id="formImgInput" class="input-cyber" accept="image/*" onchange="previewImage(event)">
          <input type="hidden" name="Görsel Verisi (Base64)" id="formImgBase64">
          <div class="img-preview-box">
            <span class="img-preview-placeholder" id="previewPlaceholder">🖼️ Görsel Önizleme Alanı</span>
            <img id="imagePreview" alt="Önizleme">
          </div>
        </div>

        <div class="form-group">
          <label for="formCarName">Araç Modeli:</label>
          <input type="text" name="Araç Modeli" id="formCarName" class="input-cyber" placeholder="Örn: BMW M5 CS" required>
        </div>

        <div class="form-group">
          <label for="formSeller">Satıcı İsim / Nick:</label>
          <input type="text" name="Satıcı Nick" id="formSeller" class="input-cyber" placeholder="Örn: Yakup" required>
        </div>
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
          <div class="form-group">
            <label for="formHp">Motor Gücü (HP):</label>
            <input type="number" name="HP" id="formHp" class="input-cyber" placeholder="1690">
          </div>
          <div class="form-group">
            <label for="formKm">Kilometre (KM):</label>
            <input type="number" name="KM" id="formKm" class="input-cyber" placeholder="500">
          </div>
        </div>

        <div class="form-group">
          <label for="formPrice">Satış Fiyatı:</label>
          <input type="text" name="Fiyat" id="formPrice" class="input-cyber" placeholder="Örn: 5.000.000$ veya 250 Coin" required>
        </div>

        <div class="form-group">
          <label for="formSocial">İletişim Adresi (Instagram/Discord/Tel):</label>
          <input type="text" name="İletişim Adresi" id="formSocial" class="input-cyber" placeholder="@kullanici_adi" required>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label"><input type="checkbox" name="W16 var mı?" value="EVET"> ⚡ W16 Motor Var</label>
          <label class="checkbox-label"><input type="checkbox" name="Çizim var mı?" value="EVET"> 🎨 Özel Çizim/Livery</label>
          <label class="checkbox-label"><input type="checkbox" name="Acil İlan mı?" value="EVET"> 🔥 Fırsat İlanı</label>
        </div>
        
        <button type="submit" class="btn-cyber" style="width:100%; margin-top: 15px; background: linear-gradient(45deg, var(--neon-green), #00b0ff); color:#000;">
          🚀 Formu Gönder
        </button>
      </form>
    </div>
  </div>

  <script>
    // İlanlar temizlendi (Boş liste)
    const rawCars = [];

    let favorites = [];
    let currentCategory = 'all';

    function updateStats() {
      document.getElementById('statTotal').textContent = rawCars.length;
      document.getElementById('statW16').textContent = rawCars.filter(c => c.hasW16).length;
      document.getElementById('statDeals').textContent = rawCars.filter(c => c.isDeal).length;
    }

    function toggleFavorite(id, event) {
      event.stopPropagation();
      if(favorites.includes(id)) {
        favorites = favorites.filter(favId => favId !== id);
      } else {
        favorites.push(id);
      }
      renderGallery();
    }

    function setCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.pill-cyber').forEach(b => b.classList.remove('active'));
      if(btn) btn.classList.add('active');
      renderGallery();
    }

    function filterCars() {
      renderGallery();
    }

    function renderGallery() {
      const gallery = document.getElementById('carGallery');
      const search = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;
      const minHp = parseInt(document.getElementById('minHpInput').value) || 0;

      let filtered = rawCars.filter(car => {
        const matchesSearch = car.title.toLowerCase().includes(search) || car.seller.toLowerCase().includes(search);
        const matchesHp = car.hp >= minHp;
        
        let matchesCategory = true;
        if(currentCategory === 'deal') matchesCategory = car.isDeal;
        if(currentCategory === 'livery') matchesCategory = car.hasLivery;
        if(currentCategory === 'w16') matchesCategory = car.hasW16;
        if(currentCategory === 'coin') matchesCategory = car.isCoin;
        if(currentCategory === 'favs') matchesCategory = favorites.includes(car.id);

        return matchesSearch && matchesHp && matchesCategory;
      });

      // Sıralama
      if(sort === 'hp-desc') filtered.sort((a,b) => b.hp - a.hp);
      if(sort === 'km-asc') filtered.sort((a,b) => a.km - b.km);
      if(sort === 'price-asc') filtered.sort((a,b) => a.rawPrice - b.rawPrice);

      if(filtered.length === 0) {
        gallery.innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-muted);">
            <h3>🏎️ Henüz Yayınlanmış İlan Bulunmuyor</h3>
            <p>Yukarıdaki "İlan Gönder" butonuna tıklayarak ilk ilanı doğrudan gönderebilirsin.</p>
          </div>
        `;
        return;
      }

      gallery.innerHTML = filtered.map(car => {
        const isFav = favorites.includes(car.id);
        return `
          <div class="neon-card">
            <div class="card-img-wrap">
              <img src="${car.image}" alt="${car.title}">
              <div class="badge-stack">
                ${car.isDeal ? `<span class="cyber-badge badge-deal">🔥 HOT DEAL</span>` : ''}
                ${car.hasW16 ? `<span class="cyber-badge badge-w16">⚡ W16</span>` : ''}
                ${car.hasLivery ? `<span class="cyber-badge badge-livery">🎨 LIVERY</span>` : ''}
              </div>
              <div class="card-top-actions">
                <button class="icon-btn fav ${isFav ? 'active' : ''}" onclick="toggleFavorite(${car.id}, event)">
                  ${isFav ? '♥' : '♡'}
                </button>
              </div>
            </div>
            <div class="card-body">
              <div class="seller-info">👤 ${car.seller}</div>
              <div class="car-title">${car.title}</div>
              <div class="specs-row">
                <div>⚡ <b>${car.hp}</b> HP</div>
                <div>🛣️ <b>${car.km}</b> KM</div>
              </div>
              <div class="price-row">
                <div class="cyber-price ${car.isCoin ? 'coin' : ''}">${car.price}</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;

        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const maxWidth = 450;
          const scaleSize = maxWidth / img.width;
          canvas.width = maxWidth;
          canvas.height = img.height * scaleSize;

          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const base64Img = canvas.toDataURL('image/jpeg', 0.6);

          const previewImg = document.getElementById("imagePreview");
          previewImg.src = base64Img;
          previewImg.style.display = "block";
          document.getElementById("previewPlaceholder").style.display = "none";
          document.getElementById("formImgBase64").value = base64Img;
        };
      };
      reader.readAsDataURL(file);
    }

    function openAddModal() { document.getElementById("addModal").style.display = "flex"; }
    function closeAddModal() { document.getElementById("addModal").style.display = "none"; }

    // Başlangıç Çalıştırması
    updateStats();
    renderGallery();
  </script>
</body>
</html>
